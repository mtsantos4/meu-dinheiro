name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.0
          name: Meu Dinheiro para Windows 1.0.0
          body: |
            **Instalador:** baixe `MeuDinheiro-Instalador-1.0.0.exe` e abra. Cria o atalho na área de trabalho.
            **Portátil:** `MeuDinheiro-Portatil-1.0.0.exe` roda sem instalar.
            O programa abre sempre a versão mais nova do app; não precisa reinstalar a cada atualização.
          files: |
            desktop/dist/*.exe
          make_latest: true
