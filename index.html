<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meu Dinheiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Dinheiro">
<style>
:root{
  --bg:#f4f6f5;--panel:#ffffff;--panel2:#f8faf9;--line:#e3e8e6;--text:#14201c;--muted:#66756f;
  --acc:#0f766e;--acc2:#e6f4f1;--pos:#15803d;--neg:#c2410c;--warn:#b45309;--warnbg:#fef3c7;
  --r:14px;--shadow:0 1px 2px rgba(16,24,20,.05),0 2px 8px rgba(16,24,20,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1412;--panel:#151d1a;--panel2:#1a2420;--line:#26322e;--text:#e6eeea;--muted:#8fa29a;
  --acc:#2dd4bf;--acc2:#123430;--pos:#4ade80;--neg:#fb923c;--warn:#fbbf24;--warnbg:#3a2e10;--shadow:none;
}}
*{box-sizing:border-box}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none;margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
nav.side{width:220px;flex:none;padding:20px 12px;border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:17px;padding:4px 12px 20px;display:flex;gap:8px;align-items:center}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--acc);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;inset:7px;border:2.5px solid var(--panel);border-radius:50%}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn.on{background:var(--acc2);color:var(--acc)}
.navbtn:hover:not(.on){background:var(--panel2)}
main{flex:1;min-width:0;padding:24px 28px 100px;max-width:1240px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.sp{flex:1}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.monthnav button{border:0;background:none;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.monthnav button:hover{background:var(--panel2)}
.monthnav span{min-width:120px;text-align:center;font-weight:600;text-transform:capitalize}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#04201c}}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--neg)}
.btn.ghost{border-color:transparent;background:none}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .val{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mt{margin-top:14px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.tblwrap{overflow-x:auto;margin:0 -8px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--acc2);color:var(--acc);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:hover{background:var(--panel2)}
.tx:last-child{border-bottom:0}
.tx .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.tx .main{flex:1;min-width:0}
.tx .d1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .d2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tx .v small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.dayhdr{font-size:12px;color:var(--muted);font-weight:600;padding:14px 4px 4px;text-transform:capitalize;display:flex}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button.on{background:var(--acc2);color:var(--acc)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--acc)}
.chartbox{position:relative;height:230px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--warnbg);color:var(--warn);margin-bottom:14px;font-weight:500}
.banner .sp{flex:1}
/* modal */
.ovl{overscroll-behavior:contain;position:fixed;inset:0;background:rgba(10,15,13,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--panel);border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 14px;font-size:18px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm .full{grid-column:1/-1}
.frm label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.frm input,.frm select,.frm textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-size:14px;width:100%}
.frm input:focus,.frm select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.frm .chk{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
.frm .chk input{width:auto}
.seg{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:7px 6px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted);font-size:13px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.seg button.on[data-v=despesa]{color:var(--neg)}.seg button.on[data-v=receita]{color:var(--pos)}
.mfoot{display:flex;gap:8px;margin-top:18px;align-items:center}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.fab{display:none}
nav.bottom{display:none}
.hint{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.acct{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.acct:last-child{border-bottom:0}
.acct .nm{font-weight:600}
.money-in{position:relative;display:block}
.money-in>.pfx{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none;font-size:14px}
.money-in>input{text-align:right;padding-left:48px!important;font-variant-numeric:tabular-nums}
.stickytop{position:sticky;top:0;z-index:20;background:var(--bg);margin:-24px -28px 12px;padding:24px 28px 10px;border-bottom:1px solid var(--line)}
.stickytop header.top{margin-bottom:12px}
.toolbar{display:flex;gap:8px;align-items:center}
.toolbar #fq{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:150px}
.dd{position:relative}
.ddpanel{position:absolute;right:0;top:calc(100% + 6px);width:300px;max-width:86vw;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:6px;z-index:30}
.dditem{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:9px;cursor:pointer;font-size:14px}
.dditem:hover{background:var(--panel2)}.dditem.on{color:var(--acc);font-weight:600}
.dditem .dot{margin-right:6px}
.ddvolta{color:var(--muted)}
.ddtit{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:10px 10px 4px}
.ddpanel input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--acc2);color:var(--acc);border-radius:99px;padding:3px 4px 3px 10px;font-size:13px;font-weight:500}
.chip button{border:0;background:none;color:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0 5px}
.kpimini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kpimini .card{padding:8px 12px;border-radius:12px}
.kpimini.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpimini .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpimini .lbl{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpimini .val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* evita campos (data, mês, listas) saindo da tela, principalmente no iPhone */
.frm{grid-template-columns:repeat(2,minmax(0,1fr))}
.frm>*,.frm label{min-width:0}
.frm input,.frm select,.frm textarea{max-width:100%;min-width:0}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left;margin:0}
.modal{overflow-x:hidden}
.modal .row input[type=date],.ddpanel input[type=date]{width:auto;flex:1 1 130px}
.novaversao{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;background:var(--acc);color:#fff;border:0;border-radius:99px;padding:11px 18px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
@media (min-width:761px){.novaversao{bottom:24px}}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tfix{table-layout:fixed}@media(max-width:700px){.tfix th,.tfix td{font-size:12.5px;padding-left:4px;padding-right:4px}}.so-m{display:none}.pctpill{display:inline-block;font-weight:600;font-size:12.5px;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent)}@media(max-width:700px){.tpos th:nth-child(4),.tpos td:nth-child(4){display:none}.tpos th:first-child,.tpos td:first-child{width:27%}.tpos th:nth-child(5),.tpos td:nth-child(5){width:27%}.pctpill{font-size:11.5px;padding:1px 5px}}@media(max-width:700px){.so-m{display:block}}.tfix th:first-child,.tfix td:first-child{width:24%}
.donutwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.donutleg{max-height:220px;overflow:auto}
.bloco{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--panel)}
.blococab{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel2);border:0;padding:10px 12px;cursor:pointer;font-weight:600;text-align:left;font-size:14px;color:var(--text)}
.blococab .seta{display:inline-block;transition:transform .15s;color:var(--muted);width:14px}
.bloco.fechado .seta{transform:rotate(-90deg)}
.bloco.fechado .blococorpo{display:none}.bloco .tblwrap{margin:0;scrollbar-gutter:auto}
.blococorpo{padding:0 8px 4px}
/* barras de rolagem finas e discretas, na cor do app */
*{scrollbar-width:thin;scrollbar-color:rgba(45,212,191,.35) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(45,212,191,.28);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(45,212,191,.55)}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-corner{background:transparent}
.donutleg,.ddpanel,.modal,.tblwrap{scrollbar-gutter:stable}
.donutleg{padding-right:6px}
.invtop{gap:8px;margin-bottom:12px!important}.invtop .btn{padding:7px 12px}
.invtabs{order:0}.invtabs button{padding:6px 10px}
.sparkbox{height:38px;margin:4px 0}
.resumogrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px}
.lucrobar{height:8px;border-radius:99px;background:var(--neg);overflow:hidden;margin-top:10px;opacity:.85}.lucrobar>i{display:block;height:100%;background:var(--pos)}
.provgrid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:14px;margin-bottom:14px}
.segbtn{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}.segbtn button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}.segbtn button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.rtab td,.rtab th{padding:8px 6px;font-size:13px}
.loading{padding:60px;text-align:center;color:var(--muted)}
body.deslogado nav.side,body.deslogado nav.bottom,body.deslogado .fab{display:none!important}
.login{max-width:400px;margin:10vh auto 0}
@media (max-width:1000px){.resumogrid,.provgrid{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  nav.side{display:none}
  main{padding:16px 14px 110px}
  .g2,.g3{grid-template-columns:1fr}
  .kpi .val{font-size:19px}
  nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.bottom .navbtn{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;align-items:center;text-align:center}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:78px;width:54px;height:54px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:28px;z-index:41;box-shadow:0 6px 18px rgba(15,118,110,.35);cursor:pointer}
  .hide-m{display:none}
  .ovl{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:94vh}
  .frm{grid-template-columns:minmax(0,1fr)}
  .resumogrid,.provgrid{grid-template-columns:minmax(0,1fr)}
  .invtabs{width:100%}
  .stickytop{margin:-16px -14px 10px;padding:12px 14px 8px}
  .stickytop header.top{margin-bottom:8px}.stickytop header.top h1{font-size:19px}
  .kpimini .val{font-size:14px}.kpimini .card{padding:7px 9px}
  .kpimini.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpimini .sub{display:none}
  .stickytop .tabs{width:100%}
  .toolbar select{max-width:136px;padding:8px 6px}
  /* no celular, os filtros abrem como uma folha que sobe de baixo, dentro da tela */
  .ddpanel{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;max-height:72vh;border-radius:18px 18px 0 0;padding:8px 8px calc(14px + env(safe-area-inset-bottom));z-index:60;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
  .ddfundo{position:fixed;inset:0;background:rgba(10,15,13,.45);z-index:55}
  .dditem{padding:13px 12px;font-size:16px}
  /* iPhone: campos com 16px evitam o zoom automático ao tocar */
  input,select,textarea,.frm input,.frm select,.frm textarea,.filters select,.filters input{font-size:16px!important}
}
</style>
</head>
<body class="deslogado">
<div class="app">
  <nav class="side" id="side"></nav>
  <main id="main"><div class="loading">Carregando seus dados…</div></main>
</div>
<nav class="bottom" id="bottom"></nav>
<button class="fab" id="fab" title="Novo lançamento">+</button>
<div id="modalRoot"></div>

<script>
/* ============ utilidades ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmtUSD = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'USD'});
const money = (v, cur='BRL') => (cur==='USD'?fmtUSD:fmtBRL).format(Number.isFinite(v)?v:0);
const fmtN = (v, d=2) => (Number.isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtQ = v => (Number.isFinite(v)?v:0).toLocaleString('pt-BR',{maximumFractionDigits:8});
const pct = v => (Number.isFinite(v)?(v>0?'+':'')+fmtN(v*100,2)+'%':'—');
function parseNum(s){
  if (typeof s === 'number') return s;
  s = String(s ?? '').trim().replace(/[R$\sUS]/g,'');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  const n = parseFloat(s); return Number.isFinite(n) ? n : 0;
}
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthOf = iso => (iso||'').slice(0,7);
function addMonths(ym, n){ let [y,m]=ym.split('-').map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return `${y}-${pad(m)}`; }
function addMonthsDate(iso, n){ const [y,m,d]=iso.split('-').map(Number); const ym=addMonths(`${y}-${pad(m)}`,n); const [ny,nm]=ym.split('-').map(Number); const last=new Date(ny,nm,0).getDate(); return `${ym}-${pad(Math.min(d,last))}`; }

function supabaseStore(){
  const pageAll = async (q) => { const out=[]; for (let from=0;;from+=1000){ const {data,error}=await q().range(from,from+999); if(error) throw error; out.push(...data); if(data.length<1000) break; } return out; };
  return {
    async loadAll(){
      const [docs, merc] = await Promise.all([
        pageAll(()=>sb.from('docs').select('col,id,data').order('col').order('id')),
        pageAll(()=>sb.from('mercado_docs').select('col,id,data').order('col').order('id'))
      ]);
      return {docs, mercado: merc};
    },
    async put(col,id,data){ const {error}=await sb.from('docs').upsert({user_id:userId,col,id,data},{onConflict:'user_id,col,id'}); if(error) throw error; },
    async putMany(items){ const {error}=await sb.from('docs').upsert(items.map(([col,id,data])=>({user_id:userId,col,id,data})),{onConflict:'user_id,col,id'}); if(error) throw error; },
    async del(col,id){ const {error}=await sb.from('docs').delete().eq('user_id',userId).eq('col',col).eq('id',id); if(error) throw error; },
    async delMany(col,ids){ for (let i=0;i<ids.length;i+=200){ const {error}=await sb.from('docs').delete().eq('user_id',userId).eq('col',col).in('id',ids.slice(i,i+200)); if(error) throw error; } },
    subscribe(onDoc, onMerc){
      const ch = sb.channel('sync-'+userId)
        .on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'user_id=eq.'+userId}, p => onDoc(p.eventType, p.eventType==='DELETE'?p.old:p.new))
        .on('postgres_changes',{event:'*',schema:'public',table:'mercado_docs'}, p => onMerc(p.eventType, p.eventType==='DELETE'?p.old:p.new))
        .subscribe();
      return () => sb.removeChannel(ch);
    }
  };
}

  rebuild(row.col); scheduleRender(); if (['proventos','operacoes','ativos','contas'].includes(row.col)) scheduleSync();

  try {
    const {data, error} = await sb.functions.invoke('atualizar', {body:{}});
    if (error || !data || !data.ok){ throw new Error((data&&data.erro) || (error&&error.message) || 'falha'); }
    if (data.jaEmAndamento) atualizando = {desde: Date.parse(data.desde)||Date.now()};

  setTimeout(()=>{ if (atualizando){ atualizando=null; scheduleRender(); toast('A atualização está demorando. Os dados aparecem assim que terminar.'); } }, 240000);
}

/* ============ cálculos: carteira ============ */
function opsDo(ticker){ return list('operacoes').filter(o=>o.ticker===ticker).sort((a,b)=> (a.data+(a.criadoEm||'')).localeCompare(b.data+(b.criadoEm||''))); }
function posicao(ticker, ate){
  let qtd=0, custo=0, custoBRL=0, realizado=0, primeira=null;
  for (const o of opsDo(ticker)){
    if (ate && o.data > ate) break;
    const q = +o.qtd||0, p=+o.preco||0, tx=+o.taxas||0, fx=+o.cambio||1;
    if (o.tipo==='compra'){ qtd+=q; custo+=q*p+tx; custoBRL+=(q*p+tx)*fx; if(!primeira) primeira=o.data; }
    else if (o.tipo==='venda'){ if(qtd>0){ const pm=custo/qtd, pmB=custoBRL/qtd; const qv=Math.min(q,qtd); realizado += qv*p - tx - pm*qv; custo-=pm*qv; custoBRL-=pmB*qv; qtd-=qv; if(qtd<1e-10){qtd=0;custo=0;custoBRL=0;} } }
    else if (o.tipo==='desdobramento'){ qtd*= (+o.fator||1); }
    else if (o.tipo==='bonificacao'){ qtd+=q; custo+=q*p; custoBRL+=q*p*fx; }
  }
  return {qtd, custo, custoBRL, pm: qtd? custo/qtd:0, realizado, primeira};
}
/* Rentabilidade ponderada pelo tempo (TWR) de um ativo: encadeia a variação de preço entre
   cada operação e soma os proventos por cota no período — não depende de quando/quanto foi aportado. */
function rentTWR(ticker, precoAtual, divs){
  const ops = opsDo(ticker); if (!ops.length || precoAtual==null) return null;
  let qtd=0, ref=null, ini=null, acc=1, divAcum=0; const ds=(divs||[]).slice().sort((a,b)=>a.data.localeCompare(b.data)); let di=0;
  const fecha = (ate, preco) => { // fecha o subperíodo [ini, ate)
    while (di<ds.length && ds[di].data < ate){ if (ds[di].data>=ini) divAcum += ds[di].porCota; di++; }
    if (ref>0) acc *= (preco + divAcum)/ref; divAcum=0;
  };
  for (const o of ops){
    const q=+o.qtd||0, pr=+o.preco||0;
    if (o.tipo==='compra' || o.tipo==='venda'){
      if (!(pr>0)) continue;
      if (qtd>0) fecha(o.data, pr); else { while (di<ds.length && ds[di].data < o.data) di++; }
      qtd += o.tipo==='compra'? q : -Math.min(q,qtd); if (qtd<1e-10) qtd=0;
      ref = pr; ini = o.data;
    } else if (o.tipo==='desdobramento'){ const f=+o.fator||1; qtd*=f; if (ref) ref/=f; }
    else if (o.tipo==='bonificacao'){ if (qtd>0 && ref){ ref *= qtd/(qtd+q); } qtd+=q; }
  }
  if (qtd<=0 || !ref) return null;
  fecha('9999-12-31', precoAtual);
  return acc-1;
}
function carteira(){
  const c = cfg(); const rows=[];
  const provAt = {}, divAt = {}; proventosCalc().forEach(p=>{ if (p.status!=='pago') return; const m=p.ativo.moeda||'BRL'; const v = p.moeda===m? p.liquido : (m==='USD'? p.liquidoBRL/c.usdbrl : p.liquidoBRL); provAt[p.ticker]=(provAt[p.ticker]||0)+v; if (p.qtd>0) (divAt[p.ticker]=divAt[p.ticker]||[]).push({data:p.dataCom||p.dataPagamento, porCota:v/p.qtd}); });
  for (const a of list('ativos')){
    const p = posicao(a.ticker); const m = D.mercado[safeId(a.ticker)];
    const moeda = a.moeda||'BRL'; const fx = moeda==='USD'? c.usdbrl : 1;
    const preco = m && Number.isFinite(+m.preco) ? +m.preco : null;
    const valor = preco!=null ? p.qtd*preco : p.custo; // sem cotação, usa o custo
    const resultado = preco!=null ? valor - p.custo : 0;
    rows.push({...a, ...p, moeda, preco, mercado:m, valor, valorBRL: valor*fx, custoAtualBRL: moeda==='USD' ? p.custoBRL : p.custo, resultado, resultadoPct: p.custo? resultado/p.custo : 0, provRec: provAt[a.ticker]||0, rentReal: (()=>{ const t = rentTWR(a.ticker, preco, divAt[a.ticker]); return t==null? (p.custo? (resultado+(provAt[a.ticker]||0))/p.custo : 0) : t; })(), variacao: m? +m.variacao : null});
  }
  const ativos = rows.filter(r=>r.qtd>0).sort((a,b)=>b.valorBRL-a.valorBRL);
  const total = ativos.reduce((s,r)=>s+r.valorBRL,0);
  const custo = ativos.reduce((s,r)=>s+r.custoAtualBRL,0);
  ativos.forEach(r=> r.peso = total? r.valorBRL/total : 0);
  return {ativos, todos: rows, total, custo, resultado: total-custo};
}
function liquidoProvento(p, a){
  const c = cfg(); let ir = 0;
  if (p.tipo==='jcp') ir = c.irJcp;
  else if ((a && a.moeda)==='USD' && p.tipo!=='amortizacao') ir = c.irExterior;
  return (+p.valor||0) * (1-ir);
}
function proventosCalc(){
  const hoje = todayISO(); const out=[];
  for (const p of list('proventos')){
    const a = Object.values(D.ativos).find(x=>x.ticker===p.ticker); if(!a) continue;
    const ref = p.dataCom || p.dataPagamento; if (!ref) continue;
    const qtd = posicao(p.ticker, ref).qtd; if (qtd<=0) continue;
    const moeda = p.moeda || a.moeda || 'BRL';
    const bruto = qtd*(+p.valor||0), liquido = qtd*liquidoProvento(p,a);
    const status = p.dataPagamento && p.dataPagamento<=hoje ? 'pago' : (p.dataCom && p.dataCom<hoje ? 'areceber' : 'anunciado');
    out.push({...p, ativo:a, qtd, bruto, liquido, moeda, liquidoBRL: liquido*(moeda==='USD'?cfg().usdbrl:1), status});
  }
  return out.sort((a,b)=>(b.dataPagamento||b.dataCom||'').localeCompare(a.dataPagamento||a.dataCom||''));
}

let syncT; function scheduleSync(){ clearTimeout(syncT); syncT=setTimeout(syncProventos, 1500); }
let syncing=false;
async function syncProventos(){
  if (syncing || !canWrite || !store || !COLS.every(k=>loaded[k])) return;
  const c = cfg();
  if (!c.proventosDesde){ try{ await put('config','geral',{...(U.config.geral||{}), proventosDesde: todayISO()}); }catch(e){} return; }
  syncing=true;
  try{
    const hoje = todayISO();
    for (const p of proventosCalc()){
      if (p.status!=='pago' || !p.dataPagamento || p.dataPagamento < c.proventosDesde) continue;
      const conta = p.ativo.contaProventosId && D.contas[p.ativo.contaProventosId]; if (!conta) continue;
      const tid = 'prov_'+safeId(p.id);
      if (D.transacoes[tid]) continue;
      let valor = p.liquido; const cm = conta.moeda||'BRL';
      if (p.moeda==='USD' && cm==='BRL') valor *= c.usdbrl; if (p.moeda==='BRL' && cm==='USD') valor /= c.usdbrl;
      const cat = catProventos();
      await put('transacoes', tid, {data:p.dataPagamento, descricao:`${TIPO_PROV[p.tipo]||'Provento'} ${p.ticker}`, valor: Math.round(valor*100)/100, tipo:'receita', categoriaId:cat, contaId:conta.id, pago:true, conferir:true, origem:'provento', ref:p.id, obs:`${fmtQ(p.qtd)} cotas × ${money(+p.valor,p.moeda)} (data-com ${fmtData(p.dataCom)})`, criadoEm:new Date().toISOString()});
    }
  } finally { syncing=false; }
  gerarRecorrencias();
}
/* ============ Lançamentos fixos (recorrências) ============ */
const HORIZONTE_FIXAS = 6; // meses à frente
const recIdMes = (rid, ym) => 'rec_'+rid+'_'+ym;
function txDaRecorrencia(r, ym){
  const dia = Math.min(Math.max(1, +r.dia||1), +ultimoDia(ym).slice(8)); const data = `${ym}-${pad(dia)}`;
  const tx = {tipo:r.tipo||'despesa', valor:+r.valor||0, data, descricao:r.descricao||'', categoriaId:r.categoriaId||null, contaId:r.cartaoId?null:(r.contaId||null), cartaoId:r.cartaoId||null, recorrenciaId:r.id, origem:'fixa', obs:r.obs||'', criadoEm:new Date().toISOString()};
  if (r.cartaoId){ tx.faturaMes = faturaMesPara(D.cartoes[r.cartaoId]||{fechamento:1,vencimento:10}, data); tx.pago = true; }
  else tx.pago = r.autoPago!==false ? data<=todayISO() : false;
  return tx;
}
let gerandoFixas=false;
async function gerarRecorrencias(){
  if (gerandoFixas || !canWrite || !store || !COLS.every(k=>loaded[k])) return;
  gerandoFixas=true;
  try {
    const hoje=todayISO(), atual=monthOf(hoje), limite=addMonths(atual, HORIZONTE_FIXAS); const novos=[];
    for (const r of list('recorrencias')){
      if (r.ativa===false || !r.inicio) continue;
      const fim = r.fim && r.fim<limite ? r.fim : limite;
      for (const ym of mesesEntre(r.inicio, fim)){
        const id=recIdMes(r.id, ym); const ex=D.transacoes[id];
        if (!ex){ novos.push(['transacoes', id, txDaRecorrencia(r, ym)]); continue; }
        if (!ex.excluida && !ex.cartaoId && !ex.pago && !ex.editado && r.autoPago!==false && ex.data<=hoje) novos.push(['transacoes', id, {...ex, pago:true}]);
      }
    }
    if (novos.length) await putMany(novos);
  } catch(e){ console.error(e); } finally { gerandoFixas=false; }
}
// aplica a edição da fixa nos lançamentos futuros (nunca mexe no passado nem nos já pagos/editados à mão)
async function aplicarFixaNoFuturo(r, aPartirDe){
  const hoje=todayISO(); const desde = aPartirDe || monthOf(hoje); const ops=[], dels=[];
  for (const t of list('transacoes').filter(t=>t.recorrenciaId===r.id)){
    const ym = t.id.slice(-7);
    if (ym < desde || t.excluida || t.editado) continue;
    if (!t.cartaoId && t.pago && t.data<=hoje) continue;
    if (r.ativa===false || (r.fim && ym>r.fim) || ym<r.inicio){ dels.push(t.id); continue; }
    const novo = txDaRecorrencia(r, ym); novo.criadoEm=t.criadoEm||novo.criadoEm;
    ops.push(['transacoes', t.id, novo]);
  }
  if (ops.length) await putMany(ops);
  if (dels.length) await delMany('transacoes', dels);
  await gerarRecorrencias();
  return ops.length + dels.length;
}

function catProventos(){
  const c = list('categorias').find(c=>c.tipo==='receita' && /provent|dividend|rendiment/i.test(c.nome));
  if (c) return c.id;
  const id='proventos'; if(!D.categorias[id]) put('categorias',id,{nome:'Proventos',tipo:'receita',cor:'#0f766e'}).catch(()=>{});
  return id;
}

/* ============ cálculos: contas e cartões ============ */
function faturaMesPara(cartao, dataISO){
  const fech = +cartao.fechamento||1, venc=+cartao.vencimento||10;
  const dia = +dataISO.slice(8,10); let ym = monthOf(dataISO);
  if (dia > fech) ym = addMonths(ym,1);       // mês do fechamento
  if (venc <= fech) ym = addMonths(ym,1);     // vencimento no mês seguinte ao fechamento
  return ym;
}
function saldoConta(id, {previsto=false, ate=null}={}){
  const c = D.contas[id]; if(!c) return 0;
  if (!previsto && !ate) ate = todayISO();   // saldo real: só o que já aconteceu até hoje
  let s = +c.saldoInicial||0;
  for (const t of txAtivas()){
    if (!previsto && !t.pago) continue;
    if (ate && t.data>ate) continue;
    if (t.cartaoId && (t.tipo==='despesa'||t.tipo==='receita')) continue;
    const v = +t.valor||0;
    if (t.contaId===id){
      if (t.tipo==='receita'||t.tipo==='resgate') s+=v;
      else if (t.tipo==='despesa'||t.tipo==='aplicacao'||t.tipo==='pagamento_fatura') s-=v;
      else if (t.tipo==='transferencia') s-=v;
      else if (t.tipo==='ajuste') s+=(+t.valor||0);
    }
    if (t.tipo==='transferencia' && t.contaDestinoId===id) s += (t.valorDestino!=null? +t.valorDestino : v);
  }
  if (previsto && ate) s -= faturasAPagar(id, ate).reduce((x,f)=>x+f.aberto,0);
  return s;
}
// conta que paga o cartão: a cadastrada; se não houver, a usada no último pagamento de fatura; se só existir uma conta, ela
function contaPagamentoCartao(k){
  if (k.contaId && D.contas[k.contaId]) return k.contaId;
  const ult = txAtivas().filter(t=>t.tipo==='pagamento_fatura' && t.cartaoId===k.id && t.contaId).sort((a,b)=>b.data.localeCompare(a.data))[0];
  if (ult) return ult.contaId;
  const cs = list('contas').filter(c=>!c.arquivada && (c.moeda||'BRL')==='BRL'); return cs.length===1 ? cs[0].id : null;
}
// faturas em aberto dos cartões pagos por esta conta, com vencimento entre o início do mês atual e a data limite
function faturasAPagar(contaId, ate){
  const out=[]; const ini = monthOf(todayISO())+'-01';
  for (const k of list('cartoes').filter(k=>contaPagamentoCartao(k)===contaId)){
    const meses = new Set(txAtivas().filter(t=>t.cartaoId===k.id && t.faturaMes).map(t=>t.faturaMes));
    for (const ym of meses){ const venc = `${ym}-${pad(Math.min(+k.vencimento||10, +ultimoDia(ym).slice(8)))}`;
      if (venc < ini || venc > ate) continue; const f=fatura(k.id, ym); const aberto=f.total-f.pago;
      if (aberto>0.005) out.push({cartaoId:k.id, ym, venc, aberto}); }
  }
  return out.sort((a,b)=>a.venc.localeCompare(b.venc));
}

    <table><tbody><tr><td><b>Previsto em ${fmtData(ate)}</b></td><td class="num"><b class="${prev>=0?'pos':'neg'}">${money(prev,mo)}</b></td></tr></tbody></table>
    ${(()=>{ const sem=list('cartoes').filter(k=>!contaPagamentoCartao(k)); return sem.length? `<div class="banner" style="margin-top:8px">Sem conta de pagamento definida: ${sem.map(k=>esc(k.nome)).join(', ')}. A fatura desses cartões não entra em nenhuma previsão. Defina em Contas e cartões › toque no cartão.</div>`:''; })()}
    <div class="hint" style="margin-top:6px">Entram: lançamentos com data até o fim do mês ainda não pagos (inclusive atrasados) e faturas em aberto dos cartões pagos por esta conta que vencem no período.</div>
    <div class="mfoot"><div class="sp"></div><button class="btn pri" data-close>Fechar</button></div>`);

const toBRL = (v, moeda) => moeda==='USD' ? v*cfg().usdbrl : v;
function fatura(cartaoId, ym){
  let total=0, pago=0; const itens=[];
  for (const t of txAtivas()){
    if (t.cartaoId!==cartaoId) continue;
    if (t.tipo==='pagamento_fatura'){ if (t.faturaMes===ym) pago+=+t.valor||0; continue; }
    if (t.faturaMes!==ym) continue;
    if (t.tipo==='despesa'){ total+=+t.valor||0; itens.push(t); }
    else if (t.tipo==='receita'){ total-=+t.valor||0; itens.push(t); }
  }
  return {total, pago, aberto: Math.max(0,total-pago), itens};
}
function limiteUsado(cartaoId){
  const meses = new Set(txAtivas().filter(t=>t.cartaoId===cartaoId && t.faturaMes).map(t=>t.faturaMes));
  let u=0; meses.forEach(m=>{ const f=fatura(cartaoId,m); u+=Math.max(0,f.total-f.pago); }); return u;
}
// mês em que o lançamento conta: compras e estornos no cartão contam no mês da fatura
const ehInvest = t => !!(D.categorias[t.categoriaId]||{}).investimento && (t.tipo==='despesa'||t.tipo==='receita') && !t.cartaoId;
const mesComp = t => (t.cartaoId && t.faturaMes && (t.tipo==='despesa'||t.tipo==='receita')) ? t.faturaMes : monthOf(t.data);
const TIPOS_NAO_RESULTADO = new Set(['transferencia','pagamento_fatura','aplicacao','resgate','ajuste']);
function resumoMes(ym){
  let rec=0, desp=0, prov=0; const porCat={};
  for (const t of txAtivas()){
    if (mesComp(t)!==ym) continue;
    if (t.tipo==='transferencia' && +t.taxa>0){ const vt=toBRL(+t.taxa, (D.contas[t.contaId]||{}).moeda||'BRL'); const ct=catTaxas(); desp+=vt; porCat[ct]=(porCat[ct]||0)+vt; continue; }
    if (TIPOS_NAO_RESULTADO.has(t.tipo) || ehInvest(t)) continue;
    const moeda = t.cartaoId? 'BRL' : ((D.contas[t.contaId]||{}).moeda||'BRL');
    const v = toBRL(+t.valor||0, moeda);
    if (t.tipo==='receita' && t.cartaoId){ desp-=v; porCat[t.categoriaId||'_']=(porCat[t.categoriaId||'_']||0)-v; continue; }
    if (t.tipo==='receita'){ rec+=v; if (t.origem==='provento' || t.categoriaId===catProvId()) prov+=v; }
    else if (t.tipo==='despesa'){ desp+=v; porCat[t.categoriaId||'_']=(porCat[t.categoriaId||'_']||0)+v; }
  }
  return {rec, desp, saldo: rec-desp, prov, porCat};
}
function catTaxas(){ const c=list('categorias').find(c=>c.tipo==='despesa' && /taxa|tarifa|impost|iof|c[aâ]mbio/i.test(c.nome)); return c?c.id:'taxas'; }
async function garantirCatTaxas(){ const id=catTaxas(); if (!D.categorias[id]) await put('categorias', id, {nome:'Taxas e tarifas', tipo:'despesa', cor:'#a16207'}); return id; }
function catProvId(){ const c=list('categorias').find(c=>c.tipo==='receita' && /provent|dividend|rendiment/i.test(c.nome)); return c?c.id:'proventos'; }
const catNome = id => (D.categorias[id]||{}).nome || 'Sem categoria';
const catCor = id => (D.categorias[id]||{}).cor || '#94a3b8';
const contaNome = id => (D.contas[id]||{}).nome || '—';
const cartaoNome = id => (D.cartoes[id]||{}).nome || '—';

function txRow(t){
  const isCard = !!t.cartaoId; let sinal=-1, cor='var(--neg)', ic='', bg=catCor(t.categoriaId), sub='';

  if (t.tipo==='ajuste'){ const v=+t.valor||0; return `<div class="tx" data-tx="${t.id}"><div class="ic" style="background:#64748b">±</div><div class="main"><div class="d1">${esc(t.descricao||'Ajuste de saldo')}</div><div class="d2">Ajuste de saldo · ${esc(contaNome(t.contaId))}</div></div><div class="v" style="color:var(--text)">${v>=0?'+':'−'}${money(Math.abs(v), moeda)}</div></div>`; }

  else sub = `${catNome(t.categoriaId)} · ${isCard? '💳 '+cartaoNome(t.cartaoId)+(t.faturaMes?' ('+mesCurto(t.faturaMes)+')':'') : contaNome(t.contaId)}`;

function vTransacoes(){

    if (f.tipo==='conferir'){ if(!t.conferir) return false; } else if (f.tipo && t.tipo!==f.tipo) return false;

  }).sort((a,b)=>{ const o=f.ordem||'desc';

    if(TIPOS_NAO_RESULTADO.has(t.tipo) || ehInvest(t)) return; const v=+t.valor||0; if(t.tipo==='receita') rec+=v; else if(t.tipo==='despesa') desp+=v; });

      const venc = `${ym}-${pad(Math.min(+k.vencimento||10, +ultimoDia(ym).slice(8)))}`;

    }

  }

  const TIPOS_F = [['despesa','Despesas'],['receita','Receitas'],['transferencia','Transferências'],['pagamento_fatura','Pagamentos de fatura'],['aplicacao','Aplicações'],['resgate','Resgates'],['ajuste','Ajustes de saldo'],['conferir','A conferir']];
  const PER_F = [['7','Últimos 7 dias'],['30','Últimos 30 dias'],['90','Últimos 90 dias'],['ano','Este ano'],['ano1','Últimos 12 meses'],['tudo','Todo o histórico']];
  const chips = [];

  if (f.cat) chips.push(['cat', catNome(f.cat)]);

  if (f.de||f.ate) chips.push(['per', f.per==='tudo'?'Todo o histórico': (PER_F.find(x=>x[0]===f.per)||[])[1] || `${f.de?fmtData(f.de):'início'} a ${f.ate?fmtData(f.ate):'hoje'}`]);

    <select id="fordem" title="Ordenar">${[['desc','↓ Recentes'],['asc','↑ Antigas'],['valor','$ Maior valor']].map(([v,n])=>`<option value="${v}" ${(f.ordem||'desc')===v?'selected':''}>${n}</option>`).join('')}</select>
  </div>
  ${chips.length? `<div class="chips">${chips.map(([k2,l])=>`<span class="chip">${esc(l)}<button data-limpa="${k2}" aria-label="Remover filtro">×</button></span>`).join('')}${chips.length>1?'<button class="btn ghost sm" data-limpa="tudo">Limpar tudo</button>':''}</div>`:''}
  <div class="kpimini">

  </div>

  <div class="card">${!txs.length? '<div class="empty">Nenhum lançamento encontrado</div>' : (f.ordem==='valor'? txs.map(t=>txRow(t).replace('<div class="d2">',`<div class="d2">${fmtData(t.data)} · `)).join('') : Object.entries(groups).map(([d,ts])=>`<div class="dayhdr">${diaNome(d)}${d.slice(0,4)!==String(new Date().getFullYear())?' de '+d.slice(0,4):''}</div>${ts.map(txRow).join('')}`).join(''))}</div>`;
}
function periodoDe(per, de, ate){ const h=todayISO(), menos=n=>{ const d=new Date(); d.setDate(d.getDate()-n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  if (per==='7') return [menos(6),h]; if (per==='30') return [menos(29),h]; if (per==='90') return [menos(89),h];
  if (per==='ano') return [h.slice(0,4)+'-01-01', h.slice(0,4)+'-12-31']; if (per==='ano1') return [menos(364),h]; if (per==='tudo') return ['0000-01-01','9999-12-31'];
  if (per==='custom') return [de||'', ate||'']; return ['',''];
}

function catOptions(sel, tipo){
  const cats = list('categorias').filter(c=>!tipo||c.tipo===tipo).sort((a,b)=>a.tipo.localeCompare(b.tipo)||a.nome.localeCompare(b.nome));

}

  return { cart, dia, diaPct: (cart.total-dia)? dia/(cart.total-dia):0, ganho: cart.resultado+realizado,

}

function calcRentab(classe){

  if (!ops.length) return null;

  const semHist = ativos.filter(a=>!G.historico[safeId(a.ticker)]).map(a=>a.ticker);
  const valorEm = ym => { let v=0; const fim = ym===atual? todayISO() : ultimoDia(ym);

/* ============ campo de dinheiro (R$ à esquerda, números entrando pela direita) ============ */
function mascara(el, moedaFn, permiteNeg){
  if (!el || el.dataset.mask) return { prefixo(){} };
  el.dataset.mask='1'; el.setAttribute('inputmode','numeric'); el.setAttribute('autocomplete','off'); el.removeAttribute('placeholder');
  const w=document.createElement('span'); w.className='money-in'; el.parentNode.insertBefore(w, el); w.appendChild(el);
  const pf=document.createElement('span'); pf.className='pfx'; w.insertBefore(pf, el);
  const fmt = c => (c<0?'-':'') + fmtN(Math.abs(c)/100, 2);
  const centavos = () => { const neg = permiteNeg && el.value.trim().startsWith('-'); const d = el.value.replace(/\D/g,''); return (parseInt(d||'0',10)) * (neg?-1:1); };
  const fim = () => { try{ const n=el.value.length; el.setSelectionRange(n,n); }catch(e){} };
  if (el.value.trim()!=='') el.value = fmt(Math.round(parseNum(el.value)*100)); else el.value = fmt(0);
  el.addEventListener('keydown', e => { if (e.key==='-' || e.key==='Subtract'){ e.preventDefault(); if (permiteNeg){ el.value = fmt(-centavos()); fim(); el.dispatchEvent(new Event('input',{bubbles:true})); } } });
  el.addEventListener('input', () => { const neg = permiteNeg && el.value.includes('-'); const d=el.value.replace(/\D/g,''); const c=parseInt(d||'0',10)*(neg?-1:1); el.value = fmt(c); fim(); });
  // ao entrar no campo, seleciona tudo: o primeiro número digitado substitui o valor (depois os números vão entrando pela direita)
  let acabouFoco=false; el.addEventListener('focus', () => { acabouFoco=true; try{ el.select(); }catch(e){} });
  el.addEventListener('mouseup', e => { if (acabouFoco){ e.preventDefault(); acabouFoco=false; } }); el.addEventListener('touchend', () => { if (acabouFoco){ setTimeout(()=>{ try{ el.select(); }catch(e){} },0); acabouFoco=false; } });
  const api = { prefixo(m){ pf.textContent = (m||(moedaFn&&moedaFn())||'BRL')==='USD' ? 'US$' : 'R$'; } };
  api.prefixo(); return api;
}

let travaY=null;
function travarFundo(){ if (travaY!==null) return; travaY=window.scrollY; const b=document.body; b.style.position='fixed'; b.style.top=(-travaY)+'px'; b.style.left='0'; b.style.right='0'; b.style.width='100%'; b.style.overflow='hidden'; }
function destravarFundo(){ if (travaY===null) return; const b=document.body, y=travaY; travaY=null; ['position','top','left','right','width','overflow'].forEach(k=>b.style[k]=''); window.scrollTo(0,y); }
function modal(html, onMount){
  const root=$('#modalRoot'); root.innerHTML=`<div class="ovl"><div class="modal" role="dialog">${html}</div></div>`;
  travarFundo();
  const ovl=$('.ovl',root); ovl.addEventListener('mousedown',e=>{ if(e.target===ovl) close(); });
  ovl.addEventListener('touchmove', e=>{ if (!e.target.closest('.modal')) e.preventDefault(); }, {passive:false});
  const close=()=>{ root.innerHTML=''; document.removeEventListener('keydown',esc_); destravarFundo(); };
  const esc_=e=>{ if(e.key==='Escape') close(); }; document.addEventListener('keydown',esc_);
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  onMount && onMount($('.modal',root), close);
  const f=root.querySelector('input:not([type=hidden]):not([type=checkbox]),select'); if(f && window.innerWidth>760) setTimeout(()=>f.focus(),30);
  return close;
}

      if (isCard && !F.faturaMes.dataset.touched){ const k=D.cartoes[mv.slice(2)]; if(k) F.faturaMes.value = (id && t.cartaoId===k.id && t.faturaMes) ? t.faturaMes : faturaMesPara(k, F.data.value||todayISO()); }

      $('#segCart',m).style.display = st.aba==='cartao'?'flex':'none';

    F.meio.onchange = refresh; F.rep.onchange = refresh; F.contaDestinoId.onchange = refresh;

    if (t.valorDestino!=null) F.valorDestino.dataset.touched='1'; F.data.onchange = () => { if(!F.faturaMes.dataset.touched || !id) { F.faturaMes.dataset.touched=''; } refresh(); };

      const mv = F.meio.value; const isCard = mv.startsWith('c:');

      const base = {...t}; delete base.id;
      Object.assign(base, {tipo:st.tipo, valor, descricao:F.descricao.value.trim(), data:F.data.value, obs:F.obs.value.trim(), origem: base.origem||'manual'});
      if (st.tipo!=='pagamento_fatura'){ base.contaId = isCard? null : mv.slice(2); base.cartaoId = isCard? mv.slice(2) : null; }
      if (st.tipo==='transferencia'){ base.contaDestinoId=F.contaDestinoId.value; base.categoriaId=null; if(base.contaDestinoId===base.contaId){ toast('Escolha contas diferentes'); return; }
        const mo=(D.contas[base.contaId]||{}).moeda||'BRL', md=(D.contas[base.contaDestinoId]||{}).moeda||'BRL';
        if (mo!==md){ const vd=parseNum(F.valorDestino.value); if(!vd){ toast('Informe o valor recebido'); return; } base.valorDestino=vd; base.cambio=parseNum(F.cambio.value)||null; base.taxa=parseNum(F.taxa.value)||0; if (base.taxa>0) await garantirCatTaxas(); }
        else { base.valorDestino=null; base.cambio=null; base.taxa=null; }
      } else { base.contaDestinoId=null; base.valorDestino=null; base.cambio=null; base.taxa=null; }
      if (st.tipo!=='transferencia' && st.tipo!=='pagamento_fatura') base.categoriaId = F.categoriaId.value || null;
      base.faturaMes = isCard ? (F.faturaMes.value || faturaMesPara(D.cartoes[mv.slice(2)], base.data)) : (st.tipo==='pagamento_fatura'? base.faturaMes : null);
      base.pago = isCard ? true : F.pago.checked;
      if (F.conferido && F.conferido.checked) base.conferir=false;
      if (!id) base.criadoEm = new Date().toISOString();
      const btn=$('#btSave',m); btn.disabled=true;
      try {
        if (id && t.recorrenciaId && D.recorrencias[t.recorrenciaId]){
          const i = await escolher('Alterar lançamento fixo', ['Só este mês','Este mês e os próximos (atualiza a despesa fixa)']);
          if (i<0){ btn.disabled=false; return; }
          if (i===0){ await put('transacoes', id, {...base, editado:true}); close(); toast('Lançamento salvo'); return; }
          const r0=D.recorrencias[t.recorrenciaId];
          const r1={...r0, tipo:base.tipo, valor, descricao:base.descricao, categoriaId:base.categoriaId||null, contaId:base.contaId||null, cartaoId:base.cartaoId||null, dia:+base.data.slice(8)}; delete r1.id;
          await put('recorrencias', t.recorrenciaId, r1);
          await put('transacoes', id, {...txDaRecorrencia({...r1,id:t.recorrenciaId}, id.slice(-7)), pago: base.pago, conferir:false, criadoEm:t.criadoEm});
          const n = await aplicarFixaNoFuturo({...r1, id:t.recorrenciaId}, addMonths(id.slice(-7),1));
          close(); toast(`Fixa atualizada · ${n+1} lançamentos ajustados`); return;
        }
        if (id && t.grupo && txAtivas().filter(x=>x.grupo===t.grupo).length>1){
          const ehParc = !!t.parcela;
          const i = await escolher(ehParc?'Alterar compra parcelada':'Alterar lançamento repetido', [ehParc?'Só esta parcela':'Só este', ehParc?'Esta e as próximas parcelas':'Este e os próximos', ehParc?'Todas as parcelas':'Todos da série']);
          if (i<0){ btn.disabled=false; return; }
          await put('transacoes', id, base);
          if (i>0){
            const outros = txAtivas().filter(x=>x.grupo===t.grupo && x.id!==id && (i===2 || x.data>t.data || (x.data===t.data && (x.parcela||'')>(t.parcela||''))));
            const dDias = Math.round((Date.parse(base.data+'T12:00:00')-Date.parse(t.data+'T12:00:00'))/86400000);
            const mDiff = (ym1,ym2) => { const [a,b]=ym1.split('-').map(Number), [c,d]=ym2.split('-').map(Number); return (c-a)*12+(d-b); };
            const dFat = (t.faturaMes && base.faturaMes && t.cartaoId===base.cartaoId) ? mDiff(t.faturaMes, base.faturaMes) : 0;
            const mudouValor = Math.abs((+t.valor||0)-valor)>=0.005;
            const itens = outros.map(o=>{ const d={...o}; delete d.id;
              Object.assign(d, {tipo:base.tipo, descricao:base.descricao, categoriaId:base.categoriaId, contaId:base.contaId, cartaoId:base.cartaoId, contaDestinoId:base.contaDestinoId, obs:base.obs});
              if (mudouValor) d.valor = valor;
              if (dDias){ const x=new Date(o.data+'T12:00:00'); x.setDate(x.getDate()+dDias); d.data=`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; }
              if (base.cartaoId){ d.faturaMes = (t.cartaoId!==base.cartaoId || !o.faturaMes) ? faturaMesPara(D.cartoes[base.cartaoId], d.data) : addMonths(o.faturaMes, dFat); d.pago=true; } else d.faturaMes=null;
              return ['transacoes', o.id, d]; });
            await putMany(itens);
            toast(`${itens.length+1} lançamentos alterados`); close(); return;
          }
        }
        else if (id){ await put('transacoes', id, base); }
        else if (F.rep.value==='fixo'){
          const rid=newId(); const k={...base};
          await put('recorrencias', rid, {tipo:k.tipo, valor, descricao:k.descricao, categoriaId:k.categoriaId||null, contaId:k.contaId||null, cartaoId:k.cartaoId||null, dia:+k.data.slice(8), inicio:monthOf(k.data), fim:null, autoPago:true, ativa:true, obs:k.obs||'', criadoEm:new Date().toISOString()});
          await gerarRecorrencias(); close(); toast(`Lançamento fixo criado · os próximos ${HORIZONTE_FIXAS} meses já estão lançados`); return;
        }
        else if (F.rep.value){
          const n = Math.max(2, Math.min(120, parseInt(F.n.value)||2)); const grupo=uid();
          const vParc = F.rep.value==='parc' ? Math.round(valor/n*100)/100 : valor;
          for (let i=0;i<n;i++){
            const d = addMonthsDate(base.data, i);
            const tx = {...base, data:d, grupo, valor: (F.rep.value==='parc' && i===n-1)? Math.round((valor - vParc*(n-1))*100)/100 : vParc, parcela: F.rep.value==='parc' ? `${i+1}/${n}` : null, pago: isCard? true : (i===0? base.pago : false)};
            if (isCard) tx.faturaMes = addMonths(base.faturaMes, i);
            await put('transacoes', newId('transacoes'), tx);
          }
        } else await put('transacoes', newId('transacoes'), base);
        close(); toast('Lançamento salvo');
      } catch(e){ btn.disabled=false; }
    };
    if ($('#btDel',m)) $('#btDel',m).onclick = async () => {
      if (t.recorrenciaId && D.recorrencias[t.recorrenciaId]){
        const i = await escolher('Excluir lançamento fixo', ['Só este mês','Encerrar a fixa (este mês e os próximos)']); if (i<0) return;
        if (i===0){ await patch('transacoes', id, {excluida:true}); close(); toast('Excluído só este mês'); return; }
        const ym=id.slice(-7); const r0=D.recorrencias[t.recorrenciaId]; const r1={...r0, fim:addMonths(ym,-1)}; delete r1.id;
        await put('recorrencias', t.recorrenciaId, r1); await aplicarFixaNoFuturo({...r1, id:t.recorrenciaId}, ym);
        if (D.transacoes[id] && !D.transacoes[id].excluida) await del('transacoes', id);
        close(); toast('Fixa encerrada'); return;
      }
      let quais = [id];
      if (t.grupo){ const i = await escolher('Excluir lançamento repetido', ['Só este','Este e os próximos','Todos da série']); if (i<0) return; const g=txAtivas().filter(x=>x.grupo===t.grupo); quais = i===0?[id]: i===1? g.filter(x=>x.data>=t.data).map(x=>x.id) : g.map(x=>x.id); }
      else if (!(await confirmar('Excluir este lançamento?'))) return;
      for (const q of quais){ if (D.transacoes[q]?.origem==='provento') await patch('transacoes', q, {excluida:true, conferir:false}); else await del('transacoes', q); }
      close(); toast('Excluído');
    };
  });

function composicaoSaldo(id){
  const c=D.contas[id]; const hoje=todayISO(); const L={}; const add=(k,v,t)=>{ const x=L[k]=L[k]||{v:0,n:0,itens:[]}; x.v+=v; x.n++; x.itens.push(t); };
  let futuros=0, nFut=0, naoPagos=0, nNP=0, cartao=0, nCart=0;
  for (const t of txAtivas()){
    const v=+t.valor||0; const envolve = t.contaId===id || t.contaDestinoId===id; if(!envolve) continue;
    if (t.cartaoId && (t.tipo==='despesa'||t.tipo==='receita')){ cartao+=v; nCart++; continue; }
    if (t.data>hoje){ futuros+=v; nFut++; continue; }
    if (!t.pago){ naoPagos+=v; nNP++; continue; }
    if (t.tipo==='transferencia'){ if (t.contaId===id) add('Transferências enviadas', -v, t); if (t.contaDestinoId===id) add('Transferências recebidas', +(t.valorDestino!=null?+t.valorDestino:v), t); continue; }
    if (t.contaId!==id) continue;
    if (t.tipo==='receita') add(ehInvest(t)?'Resgates (categoria de investimento)':'Receitas', v, t);
    else if (t.tipo==='despesa') add(ehInvest(t)?'Investimentos (categoria de investimento)':'Despesas', -v, t);
    else if (t.tipo==='pagamento_fatura') add('Pagamentos de fatura', -v, t);
    else if (t.tipo==='aplicacao') add('Aplicações (compras de ativos)', -v, t);
    else if (t.tipo==='resgate') add('Resgates (vendas de ativos)', v, t);
    else if (t.tipo==='ajuste') add('Ajustes de saldo', v, t);
  }
  return {inicial:+c.saldoInicial||0, linhas:L, futuros, nFut, naoPagos, nNP, saldo:saldoConta(id)};
}
function abrirComposicao(id){
  const c=D.contas[id], mo=c.moeda||'BRL', r=composicaoSaldo(id);
  const linhas=Object.entries(r.linhas).sort((a,b)=>a[1].v-b[1].v);
  const maiores = Object.values(r.linhas).flatMap(x=>x.itens).filter(t=>t.contaId===id && t.tipo!=='transferencia').sort((a,b)=>(+b.valor)-(+a.valor)).slice(0,8);
  modal(`<h2>Composição do saldo · ${esc(c.nome)}</h2>
    <table><tbody>
      <tr><td>Saldo inicial</td><td class="num">${money(r.inicial,mo)}</td></tr>
      ${linhas.map(([k,x])=>`<tr><td>${k} <span class="hint">(${x.n})</span></td><td class="num ${x.v<0?'neg':'pos'}">${x.v<0?'−':'+'}${money(Math.abs(x.v),mo)}</td></tr>`).join('')}
      <tr><td><b>Saldo de hoje</b></td><td class="num"><b>${money(r.saldo,mo)}</b></td></tr>
    </tbody></table>
    ${r.nFut||r.nNP?`<div class="hint" style="margin-top:8px">Fora da conta: ${r.nFut?`${r.nFut} lançamentos com data futura (${money(r.futuros,mo)})`:''}${r.nFut&&r.nNP?' · ':''}${r.nNP?`${r.nNP} marcados como não pagos (${money(r.naoPagos,mo)})`:''}.</div>`:''}
    ${maiores.length?`<h3 class="mt">Maiores lançamentos</h3>${maiores.map(t=>`<div class="row" style="padding:4px 0;font-size:13px"><span style="flex:1">${fmtData(t.data)} · ${esc(t.descricao||catNome(t.categoriaId))} <span class="hint">${esc(catNome(t.categoriaId))}</span></span><span class="num">${money(+t.valor,mo)}</span></div>`).join('')}`:''}
    <div class="mfoot"><button class="btn" id="verTx">Ver lançamentos da conta</button><div class="sp"></div><button class="btn pri" data-close>Fechar</button></div>`,(m,close)=>{
    $('#verTx',m).onclick=()=>{ close(); ui.f={conta:'a:'+id,cat:'',tipo:'',q:''}; ui.faturaVer=null; go('transacoes'); };
  });
}

  <form class="frm" id="fo">
    <label>Ativo<input name="ticker" list="dlAt" value="${esc(o.ticker||'')}" placeholder="PETR4" style="text-transform:uppercase" autocomplete="off" ${id?'disabled':''}></label>

    <label class="f-fx">Dólar na data (R$)<input name="cambio" inputmode="decimal" value="${fmtN(+o.cambio||c.usdbrl,4)}"></label>
    <label class="f-f" style="display:none">Fator (ex.: 2 para 1→2; 0,1 para grupamento 10→1)<input name="fator" inputmode="decimal" value="${o.fator?fmtQ(+o.fator):''}"></label>
    <label class="full f-cta">Movimentar conta<select name="contaId"><option value="">Não movimentar</option>${list('contas').filter(x=>!x.arquivada).map(x=>`<option value="${x.id}" ${o.contaId===x.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></label>
    <div class="full hint f-tot"></div>
  </form>
  <div class="mfoot">${id?'<button class="btn danger" id="del">Excluir</button>':''}<div class="sp"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>`, (m,close)=>{
    const F=$('#fo',m); let tipo=o.tipo;
    const atv = () => D.ativos[safeId((F.ticker.value||o.ticker||'').toUpperCase().trim())];
    const refresh=()=>{ const a=atv(); const usd=a? a.moeda==='USD' : false; const ds = tipo==='desdobramento';
      ['.f-q','.f-p','.f-t','.f-cta'].forEach(s=>$(s,m).style.display= ds?'none':''); $('.f-t',m).style.display = (ds||tipo==='bonificacao')?'none':''; $('.f-cta',m).style.display=(ds||tipo==='bonificacao')?'none':''; $('.f-f',m).style.display= ds?'':'none'; $('.f-fx',m).style.display= usd && !ds ?'':'none';
      $('.f-p',m).firstChild.textContent = tipo==='bonificacao' ? 'Custo atribuído por ação' : 'Preço unitário';
      const q=parseNum(F.qtd.value), p=parseNum(F.preco.value), t=parseNum(F.taxas.value); const tot= tipo==='venda'? q*p-t : q*p+t;
      $('.f-tot',m).innerHTML = ds? '' : `Total: <b>${money(tot, usd?'USD':'BRL')}</b>${usd?` ≈ ${money(tot*parseNum(F.cambio.value))}`:''}${!a && F.ticker.value? ' · <span class="pill warn">ativo novo: você vai cadastrar a classe em seguida</span>':''}`;
      if (!id && a && !F.contaId.dataset.t){ const prev=list('operacoes').filter(x=>x.ticker===a.ticker&&x.contaId).pop(); if(prev) F.contaId.value=prev.contaId; }
    };
    m.querySelectorAll('#segOp button').forEach(b=>b.onclick=()=>{ tipo=b.dataset.v; m.querySelectorAll('#segOp button').forEach(x=>x.classList.toggle('on',x===b)); refresh(); });
    F.addEventListener('input', refresh); F.contaId.onchange=()=>F.contaId.dataset.t='1'; refresh();
    $('#ok',m).onclick = async () => {
      const tk=(F.ticker.value||o.ticker||'').toUpperCase().trim(); if(!tk) return F.ticker.focus();
      const q=parseNum(F.qtd.value), p=parseNum(F.preco.value);
      if (tipo==='desdobramento'){ if(!(parseNum(F.fator.value)>0)) { toast('Informe o fator'); return; } }
      else if (!(q>0) || (tipo!=='bonificacao' && !(p>0))){ toast('Informe quantidade e preço'); return; }
      let a = atv();
      const oid = id || newId('operacoes');
      const op = {ticker:tk, tipo, data:F.data.value, qtd: tipo==='desdobramento'?0:q, preco: tipo==='desdobramento'?0:p, taxas: (tipo==='compra'||tipo==='venda')? parseNum(F.taxas.value):0, fator: tipo==='desdobramento'? parseNum(F.fator.value):null, contaId:(tipo==='compra'||tipo==='venda')? (F.contaId.value||null):null, criadoEm:o.criadoEm||new Date().toISOString()};
      if (a && a.moeda==='USD') op.cambio = parseNum(F.cambio.value)||c.usdbrl;
      await put('operacoes', oid, op);
      await syncTxOperacao(oid);
      close(); toast('Operação salva');
      if (!a){ const g = /11$/.test(tk)?'fii': /3[2-5]$/.test(tk)?'bdr': /^(BTC|ETH|SOL|USDT|ADA|XRP|BNB|DOGE)$/.test(tk)?'cripto': /^[A-Z]{4}\d{1,2}$/.test(tk)?'acao':'etf_ext'; abrirAtivo(null, {ticker:tk, classe:g, moeda: ['etf_ext','stock_ext'].includes(g)?'USD':'BRL'}); }
    };
    if ($('#del',m)) $('#del',m).onclick = async () => { if(await confirmar('Excluir esta operação?')){ await del('operacoes',id); if(D.transacoes['op_'+id]) await del('transacoes','op_'+id); close(); } };
  });
}
async function syncTxOperacao(oid){
  const o = D.operacoes[oid]; const tid='op_'+oid;
  if (!o || !o.contaId || !(o.tipo==='compra'||o.tipo==='venda')){ if (D.transacoes[tid]) await del('transacoes', tid); return; }
  const a = D.ativos[safeId(o.ticker)]; const conta = D.contas[o.contaId];
  let v = o.tipo==='compra' ? o.qtd*o.preco + (+o.taxas||0) : o.qtd*o.preco - (+o.taxas||0);
  const am = (a&&a.moeda) || (o.cambio? 'USD':'BRL'); const cm = (conta&&conta.moeda)||'BRL';
  if (am==='USD' && cm==='BRL') v *= (+o.cambio||cfg().usdbrl);
  await put('transacoes', tid, {tipo: o.tipo==='compra'?'aplicacao':'resgate', valor: Math.round(v*100)/100, data:o.data, contaId:o.contaId, descricao:`${o.tipo==='compra'?'Compra':'Venda'} ${fmtQ(o.qtd)} ${o.ticker}`, pago:true, origem:'operacao', ref:oid, criadoEm:o.criadoEm});
}

      const pid = id || safeId(`${tk}_${F.dataCom.value}_${F.tipo.value}`);

/* ---------- Importação CSV (Mobills) ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0]||''; const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ';' : (first.includes('\t')?'\t':',');
  const rows=[]; let row=[], cell='', q=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (q){ if (ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if (ch==='"') q=true; else if (ch===sep){ row.push(cell); cell=''; } else if (ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); if(row.some(c=>c.trim()!=='')) rows.push(row); row=[]; cell=''; } else cell+=ch; }
  row.push(cell); if(row.some(c=>c.trim()!=='')) rows.push(row);
  return rows;
}
function carregarScript(src){ return new Promise((ok,err)=>{ if([...document.scripts].some(x=>x.src===src)) return ok(); const el=document.createElement('script'); el.src=src; el.onload=ok; el.onerror=()=>err(new Error('não carregou '+src)); document.head.appendChild(el); }); }
async function lerPlanilha(f){
  const buf = await f.arrayBuffer();
  if (/\.(xlsx|xlsm|xls|ods)$/i.test(f.name)){
    await carregarScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    // usa a aba com mais linhas
    let melhor=null; for (const n of wb.SheetNames){ const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}); if(!melhor||r.length>melhor.length) melhor=r; }
    return (melhor||[]).map(r=>r.map(c=> c instanceof Date ? `${c.getFullYear()}-${pad(c.getMonth()+1)}-${pad(c.getDate())}` : c)).filter(r=>r.some(c=>String(c).trim()!==''));
  }
  let txt=new TextDecoder('utf-8').decode(buf); if (txt.includes(String.fromCharCode(0xFFFD))) txt=new TextDecoder('windows-1252').decode(buf);
  return parseCSV(txt);
}
function acharCabecalho(rows){ // pula linhas de título antes do cabeçalho
  for (let i=0;i<Math.min(rows.length,15);i++){ const t=rows[i].map(c=>String(c).toLowerCase()); if (t.some(c=>/^data/.test(c.trim())) && t.some(c=>/valor/.test(c))) return i; }
  return 0;
}
function parseDataBR(s){ if (typeof s==='number' && s>20000 && s<80000){ const d=new Date(Math.round((s-25569)*86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
  s=String(s||'').trim(); let m;
  if ((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) { let y=+m[3]; if(y<100) y+=2000; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  if ((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return null; }
const RE_PGTO_FATURA = /pagamento.{0,15}fatura|pgto.{0,10}fatura|fatura.{0,10}paga|pagto.{0,10}fatura/i;
function mesFatura(v){ // '10/2026', 'out/2026', data → 'YYYY-MM'
  if (v==null || v==='') return null;
  if (typeof v==='number' && v>20000) return monthOf(parseDataBR(v));
  const s=String(v).trim().toLowerCase(); let m;
  if ((m=s.match(/^(\d{4})-(\d{2})/))) return `${m[1]}-${m[2]}`;
  if ((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))) { const y=+m[3]<100?2000+ +m[3]:+m[3]; return `${y}-${pad(m[2])}`; }
  if ((m=s.match(/^(\d{1,2})[\/\-.](\d{4})$/))) return `${m[2]}-${pad(m[1])}`;
  const i=MESES.findIndex(n=>s.startsWith(n.slice(0,3))); if (i>=0 && (m=s.match(/(\d{4}|\d{2})\s*$/))) { const y=m[1].length===2?2000+ +m[1]:+m[1]; return `${y}-${pad(i+1)}`; }
  return null;
}

const normDesc = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\(?\b\d{1,2}\s*\/\s*\d{1,2}\b\)?/g,' ').replace(/parcela|parc\.?/g,' ').replace(/[^a-z0-9]+/g,' ').trim();
const descParecida = (a,b) => { a=normDesc(a); b=normDesc(b); if(!a||!b) return false; return a===b || a.includes(b) || b.includes(a); };

    <label class="full">Cartão<select id="cCart">${cartoes.map(k=>`<option value="${k.id}">${esc(k.nome)}</option>`).join('')}</select></label>
    <label class="full">Relatório do cartão (Excel ou CSV)<input type="file" id="cFile" accept=".xlsx,.xls,.csv,.txt"></label>
    <div class="full hint">No relatório do cartão, a data de cada compra é a data em que a fatura foi paga. Cada data vira uma fatura (mês do pagamento), e o app procura a mesma compra (valor e descrição) entre os lançamentos já importados, até 400 dias antes.</div></div>
    <div id="cMapa"></div>
    <div class="mfoot"><div class="sp"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="cOk" disabled>Analisar</button></div>`, (m,close)=>{
    let rows=[], plano=null;
    $('#cFile',m).onchange = async e => {
      const f=e.target.files[0]; if(!f) return; plano=null; $('#cOk',m).textContent='Analisar';
      try { rows=await lerPlanilha(f); } catch(err){ $('#cMapa',m).innerHTML='<div class="hint">Não consegui ler: '+esc(err.message)+'</div>'; return; }
      rows=rows.slice(acharCabecalho(rows)); if(rows.length<2){ $('#cMapa',m).innerHTML='<div class="hint">Arquivo sem linhas.</div>'; return; }
      const H=rows[0].map(h=>String(h).trim()); const guess=re=>H.findIndex(h=>re.test(h));
      const g={data:guess(/^data/i), desc:guess(/descri|hist|nome/i), valor:guess(/^valor|amount/i)};
      const sel=(k,l,o)=>`<label>${l}<select data-c="${k}">${o?'<option value="-1">— nenhuma —</option>':''}${H.map((h,i)=>`<option value="${i}" ${g[k]===i?'selected':''}>${esc(h||'(coluna '+(i+1)+')')}</option>`).join('')}</select></label>`;
      let neg=0,pos=0; rows.slice(1).forEach(r=>{ if(RE_PGTO_FATURA.test(String(r[g.desc]??''))) return; const v=parseNum(r[g.valor]); if(v<0)neg++; else if(v>0)pos++; });
      const kc=D.cartoes[$('#cCart',m).value];
      $('#cMapa',m).innerHTML=`<div class="hint" style="margin:10px 0">${rows.length-1} linhas. Confira:</div><div class="frm">${sel('data','Data (pagamento da fatura)')}${sel('valor','Valor')}${sel('desc','Descrição',1)}
        <label>Compras aparecem como<select id="cSinal"><option value="-1" ${neg>=pos?'selected':''}>Valores negativos</option><option value="1" ${pos>neg?'selected':''}>Valores positivos</option></select></label>
        <label class="chk full"><input type="checkbox" id="cPg" checked> Registrar o pagamento de cada fatura na data do relatório</label>
        <label class="full">Faturas pagas com<select id="cConta">${list('contas').filter(c=>!c.arquivada).map(c=>`<option value="${c.id}" ${kc.contaId===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label>
        <label class="chk full"><input type="checkbox" id="cNovas" checked> Compras do relatório que não forem encontradas: criar no cartão</label></div><div id="cRes"></div>`;
      $('#cOk',m).disabled=false;
      $('#cMapa',m).querySelectorAll('select[data-c],#cSinal').forEach(el=>el.addEventListener('change',()=>{ plano=null; $('#cRes',m).innerHTML=''; $('#cOk',m).textContent='Analisar'; }));
    };
    $('#cOk',m).onclick = async () => {
      const k={}; m.querySelectorAll('[data-c]').forEach(s=>k[s.dataset.c]=+s.value);
      const kc=D.cartoes[$('#cCart',m).value], sinal=+$('#cSinal',m).value;
      if (!plano){
        // 1) linhas do relatório
        const itens=[]; let ign=0;
        for (let i=1;i<rows.length;i++){ const r=rows[i]; const data=parseDataBR(r[k.data]); const v=parseNum(r[k.valor]); const desc=k.desc>=0?String(r[k.desc]??'').trim():'';
          if(!data||!v) continue; if (RE_PGTO_FATURA.test(desc)){ ign++; continue; }
          itens.push({data, valor:Math.abs(v), estorno: Math.sign(v)!==sinal, desc, fat: monthOf(data)}); }
        // 2) candidatos: lançamentos de conta ainda não conciliados
        const cands = txAtivas().filter(t=>!t.cartaoId && !t.conciliacao && (t.tipo==='despesa'||t.tipo==='receita'));
        const usados=new Set(); const match=[], novos=[];
        // descrições iguais primeiro, depois só valor (se único)
        for (const passo of [1,2]){
          for (const it of itens){ if (it.m) continue;
            const tipoEsp = it.estorno?'receita':'despesa';
            let cs = cands.filter(t=>!usados.has(t.id) && t.tipo===tipoEsp && Math.abs(+t.valor-it.valor)<0.011 && diasEntre(it.data,t.data)>=-5 && diasEntre(it.data,t.data)<=400);
            if (passo===1){ cs = cs.filter(t=>descParecida(t.descricao,it.desc)); if (!cs.length) continue; }
            else if (!(cs.length===1 || (!it.desc && cs.length))) continue;
            cs.sort((a,b)=>Math.abs(diasEntre(it.data,a.data))-Math.abs(diasEntre(it.data,b.data)));
            const t=cs[0]; usados.add(t.id); it.m=t; match.push(it);
          }
        }
        itens.forEach(it=>{ if(!it.m) novos.push(it); });
        const faturas={}; itens.forEach(it=>{ const f=faturas[it.data]=faturas[it.data]||{data:it.data,fat:it.fat,total:0}; f.total += it.estorno?-it.valor:it.valor; });
        plano={itens,match,novos,faturas,ign};
        const fs=Object.values(faturas).sort((a,b)=>a.data.localeCompare(b.data));
        $('#cRes',m).innerHTML = `<div class="card" style="margin-top:12px;padding:12px"><b>Resultado da análise</b>
          <div class="hint" style="margin-top:6px">${match.length} compras encontradas nos lançamentos e que serão movidas para o cartão · ${novos.length} não encontradas${$('#cNovas',m).checked?' (serão criadas no cartão)':' (ficarão de fora)'} · ${fs.length} faturas${ign?` · ${ign} linhas de pagamento ignoradas`:''}</div>
          <div class="tblwrap" style="max-height:180px;overflow:auto;margin-top:8px"><table><thead><tr><th>Pagamento</th><th>Fatura</th><th class="num">Total</th></tr></thead><tbody>${fs.map(f=>`<tr><td>${fmtData(f.data)}</td><td>${mesCurto(f.fat)}</td><td class="num">${money(f.total)}</td></tr>`).join('')}</tbody></table></div>
          ${novos.length?`<details style="margin-top:8px"><summary class="hint">Ver as não encontradas</summary>${novos.slice(0,80).map(n=>`<div class="hint">${fmtData(n.data)} · ${esc(n.desc)} · ${money(n.valor)}</div>`).join('')}</details>`:''}</div>`;
        $('#cOk',m).textContent='Aplicar'; return;
      }
      const btn=$('#cOk',m); btn.disabled=true; btn.textContent='Aplicando…';
      const L=uid(), agora=new Date().toISOString(), ops=[];
      for (const it of plano.match){ const t=it.m; const d={...t}; delete d.id; d.antes={contaId:t.contaId||null, cartaoId:null, faturaMes:t.faturaMes||null, pago:t.pago};
        Object.assign(d,{contaId:null, cartaoId:kc.id, faturaMes:it.fat, pago:true, conciliacao:L, conciliadoEm:agora}); ops.push(['transacoes',t.id,d]); }
      if ($('#cNovas',m).checked) for (const it of plano.novos) ops.push(['transacoes',newId(),{tipo:it.estorno?'receita':'despesa', valor:it.valor, data:it.data, descricao:it.desc, categoriaId:null, contaId:null, cartaoId:kc.id, faturaMes:it.fat, pago:true, origem:'import', lote:L, criadoEm:agora}]);
      if ($('#cPg',m).checked) for (const f of Object.values(plano.faturas)) if (f.total>0.005) ops.push(['transacoes',newId(),{tipo:'pagamento_fatura', valor:Math.round(f.total*100)/100, data:f.data, contaId:$('#cConta',m).value, cartaoId:kc.id, faturaMes:f.fat, descricao:`Fatura ${kc.nome}`, pago:true, origem:'import', lote:L, criadoEm:agora}]);
      await putMany(ops); close();
      toast(`Conciliação feita: ${plano.match.length} compras movidas para o cartão${$('#cNovas',m).checked&&plano.novos.length?`, ${plano.novos.length} criadas`:''}`);
    };
    $('#cCart',m).onchange=()=>{ if(rows.length) $('#cFile',m).onchange({target:$('#cFile',m)}); };
  });
}
async function copiarBackup(){
  const out={versao:1, gerado:new Date().toISOString()}; COLS.forEach(c=>out[c]=U[c]);
  try { await navigator.clipboard.writeText(JSON.stringify(out)); toast('Backup copiado. Cole num arquivo .json e guarde.'); }
  catch(e){ modal(`<h2>Backup</h2><p class="hint">Selecione tudo e copie:</p><textarea style="width:100%;height:240px" readonly>${esc(JSON.stringify(out))}</textarea><div class="mfoot"><div class="sp"></div><button class="btn" data-close>Fechar</button></div>`); }
}
function abrirRestaurar(){
  modal(`<h2>Restaurar backup</h2><div class="frm"><label class="full">Arquivo .json<input type="file" id="fj" accept=".json,.txt"></label><div class="full hint">Os dados do backup são somados aos atuais. Itens com o mesmo identificador são substituídos.</div></div><div class="mfoot"><div class="sp"></div><button class="btn" data-close>Cancelar</button><button class="btn pri" id="ok">Restaurar</button></div>`,(m,close)=>{
    $('#ok',m).onclick=async()=>{ const f=$('#fj',m).files[0]; if(!f) return; let js; try{ js=JSON.parse(await f.text()); }catch(e){ toast('Arquivo inválido'); return; }
      const items=[]; for (const c of COLS){ for (const [id,doc] of Object.entries(js[c]||{})){ if (c==='config' && id!=='geral') continue; if (c==='mercado') continue; items.push([c,id,doc]); } } const b=$('#ok',m); b.disabled=true; b.textContent='Restaurando…'; await putMany(items); close(); toast(`${items.length} itens restaurados`); };
  });
}

// trava o zoom por gesto de pinça (Safari ignora user-scalable em alguns casos)
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e=>{ if (e.scale && e.scale!==1) e.preventDefault(); }, {passive:false});
init();
</script>
